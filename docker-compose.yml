name: product-catalogue-mvp

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      FAKESTORE_BASE_URL: ${FAKESTORE_BASE_URL:-https://fakestoreapi.com}
      SALES_INBOX_EMAIL: ${SALES_INBOX_EMAIL:-sales@example.com}
      CLIENT_ORIGIN: http://localhost:5173
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "4000:4000"
    volumes:
      - ./server/src:/app/server/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://server:4000
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/client/src
      - ./client/index.html:/app/client/index.html
    depends_on:
      server:
        condition: service_healthy
